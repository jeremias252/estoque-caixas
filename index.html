<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Logística</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --prim: #F38020;
            --glow: rgba(243,128,32,0.35);
            --bg: #050608;
            --card-bg: rgba(15, 17, 24, 0.7);
        }
        body, html {
            margin: 0; padding: 0; font-family: 'Poppins', sans-serif;
            background-color: var(--bg); color: white; min-height: 100vh;
        }
        .bg-glow {
            position: fixed; width: 60vw; height: 60vw;
            background: radial-gradient(circle, var(--glow) 0%, transparent 60%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: -1; filter: blur(80px); transition: background 0.8s ease;
        }
        
        /* LOGIN WIZARD */
        .login-wrap {
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px; padding: 40px 30px; width: 85vw; max-width: 400px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(25px); text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .icon {
            width: 65px; height: 65px; margin: 0 auto 15px;
            background: linear-gradient(145deg, #ffb15f, var(--prim));
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 14px 30px var(--glow); transition: all 0.6s ease;
        }
        h1 { font-size: 24px; margin: 0 0 5px; font-weight: 900; }
        p { color: #9ca3af; font-size: 13px; margin: 0 0 25px; }
        
        .btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            color: white; padding: 15px; border-radius: 16px; width: 100%;
            font-family: inherit; font-weight: 700; font-size: 14.5px; cursor: pointer;
            margin-bottom: 12px; transition: all 0.2s ease;
        }
        .btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .btn-primary {
            background: linear-gradient(145deg, #ffb15f, var(--prim)); border: none;
            box-shadow: 0 8px 20px var(--glow);
        }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        input, select {
            width: 100%; padding: 15px; border-radius: 14px; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1); color: white; font-family: inherit; font-size: 15px;
            margin-bottom: 20px; box-sizing: border-box; outline: none; transition: all 0.3s ease;
        }
        input:focus, select:focus { border-color: var(--prim); box-shadow: 0 0 0 2px var(--glow); }
        .voltar { background: transparent; border: none; color: #6b7280; font-size: 13px; margin-top: 5px; }

        /* DASHBOARD PRINCIPAL */
        #dashboard { display: none; padding: 20px; max-width: 1100px; margin: 0 auto; }
        .header-dash {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .badge {
            background: var(--glow); border: 1px solid var(--prim); color: #fff;
            padding: 6px 14px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: 1px;
        }
        
        /* KPIS */
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 25px 0; }
        .kpi-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 20px; backdrop-filter: blur(20px);
        }
        .kpi-card span { font-size: 11px; color: #9ca3af; text-transform: uppercase; font-weight: 800; }
        .kpi-card b { display: block; font-size: 28px; margin-top: 5px; color: var(--prim); }

        /* TABS NAV */
        .tabs-nav {
            display: flex; gap: 8px; background: rgba(10,12,18,0.8); padding: 8px;
            border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); overflow-x: auto; margin-bottom: 25px;
        }
        .tab-btn {
            background: transparent; border: none; color: #9ca3af; padding: 10px 20px;
            border-radius: 12px; font-family: inherit; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .tab-btn.active { background: linear-gradient(145deg, #ffb15f, var(--prim)); color: white; box-shadow: 0 4px 15px var(--glow); }

        /* GRID ESTOQUE */
        .grid-estoque { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .item-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px; padding: 20px; text-align: center; backdrop-filter: blur(20px);
        }
        .item-card h4 { margin: 0 0 10px; font-size: 15px; }
        .item-card .qtd { font-size: 32px; font-weight: 900; color: var(--prim); }

        /* TOAST FLOATING NOTIFICATION */
        .toast {
            position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white;
            padding: 14px 22px; border-radius: 14px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; animation: slideIn 0.3s forwards; z-index: 999;
        }
        @keyframes slideIn { from { transform: translateY(100px); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <script>
        // LINK DO GOOGLE APPS SCRIPT INTEGRADO
        const API_URL = "https://script.google.com/macros/s/AKfycbxyWRv8Zd_jdSCmU5Co6pICdKLhHjkktTb97UN3-b1kJInU6HgccxhtvAU91XPRTuxm1w/exec";

        let estado = { setor: 'Caixas', perfil: '', dados: null };

        const EQUIPES = {
            'Caixas': ['Marcello', 'Fabiano', 'Sérgio'],
            'Torres': ['Fran', 'Henrique', 'Leonardo', 'Patrick']
        };
        const SENHAS = { 'Caixas': 'marcello123', 'Torres': 'fran123', 'coord': 'coord123' };
    </script>

    <div class="bg-glow"></div>
    <div id="toast" class="toast"></div>

    <!-- TELA DE LOGIN -->
    <div class="login-wrap" id="login-screen">
        <div class="login-card">
            <div class="icon" id="logo-icon">⬢</div>
            <h1>Portal Logística</h1>
            <p>Sistema Integrado de Gestão</p>

            <div id="step1" class="step active">
                <div style="font-size:11px; color:#cbd5e1; margin-bottom:15px; font-weight:700;">PASSO 1: SELECIONE O SETOR</div>
                <button class="btn" onclick="escolherSetor('Caixas')">📦 CAIXAS</button>
                <button class="btn" onclick="escolherSetor('Torres')">🗼 TORRES</button>
            </div>

            <div id="step2" class="step">
                <div style="font-size:11px; color:#cbd5e1; margin-bottom:15px; font-weight:700;">SETOR <span id="lbl-setor"></span> • PERFIL</div>
                <button class="btn" onclick="logar('equipe')">👀 Equipe (Visualização)</button>
                <button class="btn" onclick="irParaSenha('controle')">⚙️ Controle Operacional</button>
                <button class="btn" onclick="irParaSenha('coord')">👑 Coordenação Master</button>
                <button class="btn voltar" onclick="voltar(1)">⬅️ Voltar</button>
            </div>

            <div id="step3" class="step">
                <div style="font-size:11px; color:#cbd5e1; margin-bottom:15px; font-weight:700;">DIGITE A SENHA DE ACESSO</div>
                <input type="password" placeholder="••••••••" id="senha-input">
                <button class="btn btn-primary" onclick="validarSenha()">ENTRAR NO PAINEL</button>
                <button class="btn voltar" onclick="voltar(2)">⬅️ Voltar</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="dashboard">
        <div class="header-dash">
            <div>
                <span class="badge" id="badge-setor">SETOR CAIXAS</span>
                <h2 style="margin: 5px 0 0; font-size: 22px;">Painel Operacional</h2>
            </div>
            <button class="btn" style="width: auto; padding: 8px 16px; margin:0;" onclick="logout()">🚪 Sair</button>
        </div>

        <div class="kpis">
            <div class="kpi-card"><span>Peças em Estoque</span><b id="kpi-total">0</b></div>
            <div class="kpi-card"><span>Modelos Cadastrados</span><b id="kpi-modelos">0</b></div>
            <div class="kpi-card"><span>Itens Zerados</span><b id="kpi-zerados" style="color:#ef4444">0</b></div>
        </div>

        <div class="tabs-nav">
            <button class="tab-btn active" onclick="mudarAba('catalogo', this)">🗂️ Catálogo</button>
            <button class="tab-btn" onclick="mudarAba('saida', this)">📤 Saídas</button>
            <button class="tab-btn" onclick="mudarAba('entrada', this)">📥 Entradas</button>
        </div>

        <!-- CONTEÚDO TAB CATALOGO -->
        <div id="tab-catalogo">
            <input type="text" placeholder="🔍 Buscar modelo..." oninput="filtrarEstoque(this.value)">
            <div class="grid-estoque" id="grid-estoque"></div>
        </div>

        <!-- CONTEÚDO TAB SAÍDA -->
        <div id="tab-saida" style="display:none;">
            <div class="kpi-card">
                <h3>📤 Registrar Saída</h3>
                <select id="saida-pessoa"></select>
                <select id="saida-modelo"></select>
                <input type="number" id="saida-qtd" value="1" min="1" placeholder="Quantidade">
                <button class="btn btn-primary" onclick="salvarMovimento('Saída')">Confirmar Saída</button>
            </div>
        </div>

        <!-- CONTEÚDO TAB ENTRADA -->
        <div id="tab-entrada" style="display:none;">
            <div class="kpi-card">
                <h3>📥 Registrar Entrada</h3>
                <select id="entrada-pessoa"></select>
                <select id="entrada-modelo"></select>
                <input type="number" id="entrada-qtd" value="1" min="1" placeholder="Quantidade">
                <button class="btn btn-primary" onclick="salvarMovimento('Entrada')">Confirmar Entrada</button>
            </div>
        </div>
    </div>

    <script>
        function escolherSetor(setor) {
            estado.setor = setor;
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('lbl-setor').innerText = setor.toUpperCase();

            const r = document.querySelector(':root');
            if(setor === 'Torres') {
                r.style.setProperty('--prim', '#0ea5e9');
                r.style.setProperty('--glow', 'rgba(14,165,233,0.35)');
            } else {
                r.style.setProperty('--prim', '#F38020');
                r.style.setProperty('--glow', 'rgba(243,128,32,0.35)');
            }
        }

        function irParaSenha(perfil) {
            estado.perfil = perfil;
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        }

        function voltar(p) {
            document.querySelectorAll('.step').forEach(e => e.classList.remove('active'));
            document.getElementById('step' + p).classList.add('active');
        }

        function validarSenha() {
            let pwd = document.getElementById('senha-input').value;
            let correta = estado.perfil === 'coord' ? SENHAS.coord : SENHAS[estado.setor];
            if(pwd === correta) { logar(estado.perfil); } else { alert('❌ Senha incorreta!'); }
        }

        async function logar(perfil) {
            estado.perfil = perfil;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('badge-setor').innerText = 'SETOR ' + estado.setor.toUpperCase();
            await carregarDados();
        }

        async function carregarDados() {
            mostrarToast("⏳ Carregando planilha de " + estado.setor + "...");
            try {
                let res = await fetch(`${API_URL}?setor=${estado.setor}`);
                let json = await res.json();
                estado.dados = json;
                renderizarDashboard();
                mostrarToast("✅ Sincronizado com sucesso!");
            } catch(e) {
                alert("⚠️ Erro ao carregar dados. Verifique a URL do Apps Script.");
            }
        }

        function renderizarDashboard() {
            let estoque = estado.dados.estoque;
            let total = 0, zerados = 0, modelos = estoque.length - 1;
            
            let grid = document.getElementById('grid-estoque');
            let selSaidaModelo = document.getElementById('saida-modelo');
            let selEntradaModelo = document.getElementById('entrada-modelo');
            
            grid.innerHTML = '';
            selSaidaModelo.innerHTML = '';
            selEntradaModelo.innerHTML = '';

            for(let i = 1; i < estoque.length; i++) {
                let mod = estoque[i][0];
                let qtd = Number(estoque[i][1]) || 0;
                total += qtd;
                if(qtd === 0) zerados++;

                grid.innerHTML += `<div class="item-card"><h4>${mod}</h4><div class="qtd">${qtd}</div></div>`;
                selSaidaModelo.innerHTML += `<option value="${mod}">${mod} (Saldo: ${qtd})</option>`;
                selEntradaModelo.innerHTML += `<option value="${mod}">${mod}</option>`;
            }

            document.getElementById('kpi-total').innerText = total;
            document.getElementById('kpi-modelos').innerText = modelos;
            document.getElementById('kpi-zerados').innerText = zerados;

            // Pessoas
            let selPessoaS = document.getElementById('saida-pessoa');
            let selPessoaE = document.getElementById('entrada-pessoa');
            selPessoaS.innerHTML = ''; selPessoaE.innerHTML = '';
            EQUIPES[estado.setor].forEach(p => {
                selPessoaS.innerHTML += `<option value="${p}">${p}</option>`;
                selPessoaE.innerHTML += `<option value="${p}">${p}</option>`;
            });
        }

        async function salvarMovimento(tipo) {
            let isSaida = tipo === 'Saída';
            let pessoa = document.getElementById(isSaida ? 'saida-pessoa' : 'entrada-pessoa').value;
            let modelo = document.getElementById(isSaida ? 'saida-modelo' : 'entrada-modelo').value;
            let qtd = document.getElementById(isSaida ? 'saida-qtd' : 'entrada-qtd').value;

            mostrarToast(`💾 Gravando ${tipo}...`);
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ setor: estado.setor, acao: tipo, pessoa, modelo, quantidade: qtd })
            });

            await carregarDados();
            mudarAba('catalogo', document.querySelectorAll('.tab-btn')[0]);
        }

        function mudarAba(nome, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-catalogo').style.display = nome === 'catalogo' ? 'block' : 'none';
            document.getElementById('tab-saida').style.display = nome === 'saida' ? 'block' : 'none';
            document.getElementById('tab-entrada').style.display = nome === 'entrada' ? 'block' : 'none';
        }

        function mostrarToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
